# Deploys both azd projects (root `azure.yaml` — AppHost/Web/Postgres/Storage/ACS — and
# `src/DotGlasses.App/azure.yaml` — the Field App static web app, a separate azd project per
# CLAUDE.md's Deployment section) to a "staging" environment automatically, then to "production"
# gated by a manual approval — the "production" GitHub Environment must have a required-reviewers
# protection rule configured in repo Settings > Environments; that's a one-time manual step this
# workflow cannot configure for you (see CLAUDE.md's [OPEN] items).
#
# Triggered off the "App" workflow's successful completion on main, not a second push trigger —
# avoids re-running the same build/test twice per push while still only ever deploying code that
# passed CI. Uses OIDC federated credentials (no stored client secret) via `azd auth login
# --federated-credential-provider github`, following azd's own generated-pipeline convention so a
# later `azd pipeline config` run stays compatible with this file's shape.
#
# Every AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID/AZURE_LOCATION value below is a
# GitHub Environment variable/secret that doesn't exist yet — see CLAUDE.md's Deployment section
# for the exact `azd pipeline config` invocation (run by the user, not Claude) that provisions
# them for both azd projects across both environments.

name: Deploy

on:
  workflow_run:
    workflows: ["App"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-web-staging:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      # Also drives the resource group name (main.bicep: rg-${environmentName}) — AppHost.cs's
      # CAF-naming helpers assume this is exactly "dotglasses-nonprod"/"dotglasses-prod" (see
      # its EnvToken()/Workload constants), so don't rename this without updating AppHost.cs too.
      AZURE_ENV_NAME: dotglasses-nonprod
      # Required by infra/main.parameters.json's ${AZURE_POSTGRES_PASSWORD} substitution — azd
      # provision refuses to run without some value, even though the deployed Postgres Flexible
      # Server module never actually reads it (Entra ID auth only, passwordAuth: 'Disabled'). A
      # single repo-level secret covers both environments since the value is a placeholder, not
      # a real credential — see CLAUDE.md's Deployment section.
      AZURE_POSTGRES_PASSWORD: ${{ secrets.AZURE_POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: Azure/setup-azd@v2

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in with Azure (federated credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision + deploy (Web/AppHost)
        run: azd up --no-prompt

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Phase 8 (2026-08-12) — replaces reliance on Program.cs's auto-migrate-on-boot for any
      # real environment (that code path is deliberately gated to IsDevelopment() only, see its
      # own comment — it never ran here even before this step existed). Runs after `azd up` so
      # the Postgres Flexible Server and its schema-less database definitely exist. Auth: the
      # `azure/login` step above authenticates the plain `az` CLI (separate credential store from
      # `azd auth login`) via the same OIDC federated identity, so `az account get-access-token`
      # can mint a short-lived Postgres AAD token — the server has no password auth at all
      # (`passwordAuth: 'Disabled'`, Entra ID only, see AZURE_POSTGRES_PASSWORD's own comment
      # above). AZURE_POSTGRES_AAD_USERNAME is a new repo/environment variable the user must set
      # to whatever identity name `az postgres flexible-server ad-admin create` was run against
      # for this deploying principal — that grant is itself a one-time infra/RBAC step outside
      # what Claude can do from a coding session (no infra touched from a developer machine, see
      # CLAUDE.md's Deployment section), so this step is written but not yet end-to-end verified
      # against a real server.
      - name: Apply database migrations
        env:
          AZURE_POSTGRES_AAD_USERNAME: ${{ vars.AZURE_POSTGRES_AAD_USERNAME }}
        run: |
          set -euo pipefail
          POSTGRES_HOST=$(azd env get-value POSTGRES_HOSTNAME)
          PG_TOKEN=$(az account get-access-token --resource-type oss-rdbms --query accessToken -o tsv)
          export ConnectionStrings__dotglassesdb="Host=${POSTGRES_HOST};Port=5432;Database=dotglassesdb;Username=${AZURE_POSTGRES_AAD_USERNAME};Password=${PG_TOKEN};Ssl Mode=Require;Trust Server Certificate=true"
          dotnet tool install --global dotnet-ef --version 10.*
          dotnet ef database update \
            --project src/DotGlasses.Infrastructure \
            --startup-project src/DotGlasses.Web

  deploy-app-staging:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      # Deliberately the SAME env name as deploy-web-staging (not a distinct
      # "dot-glasses-field-app-staging") — this project's own main.bicep computes
      # rg-${environmentName} too, so an identical AZURE_ENV_NAME is what makes it land in the
      # same shared resource group as Web/AppHost rather than getting its own (see
      # src/DotGlasses.App/infra/main.bicep's comment and CLAUDE.md's Deployment section).
      AZURE_ENV_NAME: dotglasses-nonprod
      # Selects wwwroot/appsettings.Staging.json at build time (standalone Blazor WASM has no
      # server to send a Blazor-Environment header once deployed as static files, so this
      # MSBuild property — inherited by azd's own internal `dotnet publish` call as a plain env
      # var, which MSBuild exposes as a property automatically — is the only lever). Verified
      # locally: publishing with this set embeds `"applicationEnvironment": "Staging"` directly
      # into the runtime bundle, not just that the build succeeds.
      WasmApplicationEnvironmentName: Staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: Azure/setup-azd@v2

      - name: Log in with Azure (federated credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision + deploy (Field App)
        working-directory: src/DotGlasses.App
        run: azd up --no-prompt

  deploy-web-production:
    needs: deploy-web-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      # See deploy-web-staging's comment — must match AppHost.cs's CAF-naming assumption.
      AZURE_ENV_NAME: dotglasses-prod
      # See deploy-web-staging's comment — same placeholder-only requirement.
      AZURE_POSTGRES_PASSWORD: ${{ secrets.AZURE_POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: Azure/setup-azd@v2

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in with Azure (federated credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision + deploy (Web/AppHost)
        run: azd up --no-prompt

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # See deploy-web-staging's "Apply database migrations" step comment.
      - name: Apply database migrations
        env:
          AZURE_POSTGRES_AAD_USERNAME: ${{ vars.AZURE_POSTGRES_AAD_USERNAME }}
        run: |
          set -euo pipefail
          POSTGRES_HOST=$(azd env get-value POSTGRES_HOSTNAME)
          PG_TOKEN=$(az account get-access-token --resource-type oss-rdbms --query accessToken -o tsv)
          export ConnectionStrings__dotglassesdb="Host=${POSTGRES_HOST};Port=5432;Database=dotglassesdb;Username=${AZURE_POSTGRES_AAD_USERNAME};Password=${PG_TOKEN};Ssl Mode=Require;Trust Server Certificate=true"
          dotnet tool install --global dotnet-ef --version 10.*
          dotnet ef database update \
            --project src/DotGlasses.Infrastructure \
            --startup-project src/DotGlasses.Web

  deploy-app-production:
    needs: deploy-app-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      # See deploy-app-staging's comment — same shared-resource-group reasoning.
      AZURE_ENV_NAME: dotglasses-prod
      # See deploy-app-staging's comment — selects wwwroot/appsettings.Production.json.
      WasmApplicationEnvironmentName: Production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: Azure/setup-azd@v2

      - name: Log in with Azure (federated credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision + deploy (Field App)
        working-directory: src/DotGlasses.App
        run: azd up --no-prompt
