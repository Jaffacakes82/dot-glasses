# Deploys both azd projects (root `azure.yaml` — AppHost/Web/Postgres/Storage/ACS — and
# `src/DotGlasses.App/azure.yaml` — the Field App static web app, a separate azd project per
# CLAUDE.md's Deployment section) to a "staging" environment automatically, then to "production"
# gated by a manual approval — the "production" GitHub Environment must have a required-reviewers
# protection rule configured in repo Settings > Environments; that's a one-time manual step this
# workflow cannot configure for you (see CLAUDE.md's [OPEN] items).
#
# Triggered off the "App" workflow's successful completion on main, not a second push trigger —
# avoids re-running the same build/test twice per push while still only ever deploying code that
# passed CI. Uses OIDC federated credentials (no stored client secret) via `azd auth login
# --federated-credential-provider github`, following azd's own generated-pipeline convention so a
# later `azd pipeline config` run stays compatible with this file's shape.
#
# Every AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID/AZURE_LOCATION value below is a
# GitHub Environment variable/secret that doesn't exist yet — see CLAUDE.md's Deployment section
# for the exact `azd pipeline config` invocation (run by the user, not Claude) that provisions
# them for both azd projects across both environments.

name: Deploy

on:
  workflow_run:
    workflows: ["App"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-web-staging:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      # Also drives the resource group name (main.bicep: rg-${environmentName}) — AppHost.cs's
      # CAF-naming helpers assume this is exactly "dotglasses-nonprod"/"dotglasses-prod" (see
      # its EnvToken()/Workload constants), so don't rename this without updating AppHost.cs too.
      AZURE_ENV_NAME: dotglasses-nonprod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: Azure/setup-azd@v2

      - name: Log in with Azure (federated credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision + deploy (Web/AppHost)
        run: azd up --no-prompt

  deploy-app-staging:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      # Deliberately the SAME env name as deploy-web-staging (not a distinct
      # "dot-glasses-field-app-staging") — this project's own main.bicep computes
      # rg-${environmentName} too, so an identical AZURE_ENV_NAME is what makes it land in the
      # same shared resource group as Web/AppHost rather than getting its own (see
      # src/DotGlasses.App/infra/main.bicep's comment and CLAUDE.md's Deployment section).
      AZURE_ENV_NAME: dotglasses-nonprod
      # Selects wwwroot/appsettings.Staging.json at build time (standalone Blazor WASM has no
      # server to send a Blazor-Environment header once deployed as static files, so this
      # MSBuild property — inherited by azd's own internal `dotnet publish` call as a plain env
      # var, which MSBuild exposes as a property automatically — is the only lever). Verified
      # locally: publishing with this set embeds `"applicationEnvironment": "Staging"` directly
      # into the runtime bundle, not just that the build succeeds.
      WasmApplicationEnvironmentName: Staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: Azure/setup-azd@v2

      - name: Log in with Azure (federated credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision + deploy (Field App)
        working-directory: src/DotGlasses.App
        run: azd up --no-prompt

  deploy-web-production:
    needs: deploy-web-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      # See deploy-web-staging's comment — must match AppHost.cs's CAF-naming assumption.
      AZURE_ENV_NAME: dotglasses-prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: Azure/setup-azd@v2

      - name: Log in with Azure (federated credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision + deploy (Web/AppHost)
        run: azd up --no-prompt

  deploy-app-production:
    needs: deploy-app-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      # See deploy-app-staging's comment — same shared-resource-group reasoning.
      AZURE_ENV_NAME: dotglasses-prod
      # See deploy-app-staging's comment — selects wwwroot/appsettings.Production.json.
      WasmApplicationEnvironmentName: Production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: Azure/setup-azd@v2

      - name: Log in with Azure (federated credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision + deploy (Field App)
        working-directory: src/DotGlasses.App
        run: azd up --no-prompt
