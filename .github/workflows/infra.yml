name: Infra

# /infra doesn't exist yet — it's generated by `azd provision` reading the DotGlasses.AppHost
# model (see section 4 of the scaffolding brief), not hand-authored. This workflow is wired up
# ahead of that so validation is automatic the moment generated Bicep lands, without another
# CI change. Until then it triggers on nothing meaningful and no-ops harmlessly.

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

jobs:
  validate-bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Bicep
        run: |
          if [ ! -d infra ] || [ -z "$(find infra -name '*.bicep' -print -quit)" ]; then
            echo "No Bicep files under /infra yet — nothing to validate."
            exit 0
          fi

          for file in $(find infra -name '*.bicep'); do
            echo "Validating $file"
            az bicep build --file "$file"
          done
