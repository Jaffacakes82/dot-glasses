name: App

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "DotGlasses.sln"
      - ".github/workflows/app.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "DotGlasses.sln"
      - ".github/workflows/app.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DotGlasses.sln

      - name: Build
        run: dotnet build DotGlasses.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test DotGlasses.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
